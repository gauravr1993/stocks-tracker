# .github/workflows/daily-ingestion.yml
name: Daily Ingestion
on:
  schedule:
    - cron: '10 7 * * *'   # 8:00 AM IST, weekdays
  workflow_dispatch: {}       # lets you trigger manually from the Actions tab

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - run: python scheduler/run_ingestion.py daily
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}